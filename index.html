<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Warna aksen bilah browser (mobile) senada tema gelap indigo -->
    <meta name="theme-color" content="#0B1020" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portofolio - Fullstack Developer & Instruktur Pemrograman. Membangun aplikasi web sambil mengajar logika algoritma & database."
    />
    <title>Portofolio — Taufik Rahmanr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Terapkan tema tersimpan sebelum React memuat agar tidak ada kedipan (FOUC).
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var isDark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', isDark)
          var lang = localStorage.getItem('lang')
          if (lang) document.documentElement.lang = lang
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
